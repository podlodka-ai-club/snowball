<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Self-learning FMCG promotion agent architecture</title>
  <desc id="desc">Market data enters the Scenario Generator, which publishes normalized scenarios to Kafka. The Promotion Agent consumes scenarios and past lessons, chooses a promotion, the Market Simulator produces an outcome, and the Evaluator writes cases and lessons to xmemory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowMemory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .agent{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}
      .memory{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}
      .eval{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.5}
      .h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .label{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .memoryLabel{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d28d9}
      .arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .arrowMemory{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrowMemory)}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="540" rx="24"/>
  <text class="title" x="54" y="58">Self-Learning FMCG Promotion Agent</text>
  <text class="subtitle" x="54" y="88">market data → scenario event → decision → outcome → learning → memory → better next decision</text>

  <rect class="node" x="45" y="175" width="190" height="115" rx="16"/>
  <text class="h" x="70" y="218">Market Data</text>
  <text class="body" x="70" y="247">fixture · DB · SAP later</text>

  <rect class="node" x="285" y="175" width="210" height="115" rx="16"/>
  <text class="h" x="310" y="218">Scenario Generator</text>
  <text class="body" x="310" y="247">normalizes + publishes</text>

  <rect class="memory" x="545" y="175" width="210" height="115" rx="16"/>
  <text class="h" x="570" y="218">Kafka</text>
  <text class="body" x="570" y="245">promotion.scenarios.v1</text>

  <rect class="agent" x="805" y="175" width="210" height="115" rx="16"/>
  <text class="h" x="830" y="218">Promotion Agent</text>
  <text class="body" x="830" y="247">chooses discount</text>

  <rect class="node" x="1065" y="175" width="210" height="115" rx="16"/>
  <text class="h" x="1090" y="218">Market Simulator</text>
  <text class="body" x="1090" y="247">produces outcome</text>

  <rect class="eval" x="1325" y="175" width="225" height="115" rx="16"/>
  <text class="h" x="1350" y="218">Evaluator / Learner</text>
  <text class="body" x="1350" y="247">oracle replay + lesson</text>

  <rect class="memory" x="845" y="375" width="320" height="110" rx="18"/>
  <text class="h" x="870" y="418">xmemory</text>
  <text class="body" x="870" y="447">persistent cases + reusable lessons</text>

  <path class="arrow" d="M235 232 H275"/>
  <text class="label" x="240" y="216">fetch</text>

  <path class="arrowMemory" d="M495 232 H535"/>
  <text class="memoryLabel" x="500" y="216">publish</text>

  <path class="arrowMemory" d="M755 232 H795"/>
  <text class="memoryLabel" x="760" y="216">consume</text>

  <path class="arrow" d="M1015 232 H1055"/>
  <text class="label" x="1019" y="216">promotion</text>

  <path class="arrow" d="M1275 232 H1315"/>
  <text class="label" x="1280" y="216">outcome</text>

  <path class="arrowMemory" d="M930 375 V335 H910 V300"/>
  <text class="memoryLabel" x="835" y="348">past lessons</text>

  <path class="arrowMemory" d="M1438 290 V430 H1175"/>
  <text class="memoryLabel" x="1225" y="412">cases + lessons</text>
</svg>
