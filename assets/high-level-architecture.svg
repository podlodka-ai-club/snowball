<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Self-learning FMCG promotion agent architecture</title>
  <desc id="desc">Scenario Generator feeds the Promotion Agent, which reads past lessons from xmemory, chooses a promotion, receives an outcome from the Market Simulator, and the Evaluator writes cases and lessons back to xmemory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowMemory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .agent{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}
      .memory{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}
      .eval{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.5}
      .h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .memoryLabel{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d28d9}
      .arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .arrowMemory{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrowMemory)}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="520" rx="24"/>
  <text class="title" x="54" y="58">Self-Learning FMCG Promotion Agent</text>
  <text class="subtitle" x="54" y="88">Scenario → decision → outcome → learning → memory → better next decision</text>

  <rect class="node" x="70" y="170" width="230" height="120" rx="16"/>
  <text class="h" x="95" y="216">Scenario Generator</text>
  <text class="body" x="95" y="246">Creates promotion scenario</text>

  <rect class="agent" x="390" y="170" width="230" height="120" rx="16"/>
  <text class="h" x="415" y="216">Promotion Agent</text>
  <text class="body" x="415" y="246">Chooses discount</text>

  <rect class="node" x="710" y="170" width="230" height="120" rx="16"/>
  <text class="h" x="735" y="216">Market Simulator</text>
  <text class="body" x="735" y="246">Produces business outcome</text>

  <rect class="eval" x="1030" y="170" width="250" height="120" rx="16"/>
  <text class="h" x="1055" y="216">Evaluator / Learner</text>
  <text class="body" x="1055" y="246">Measures regret and learns</text>

  <rect class="memory" x="530" y="360" width="300" height="110" rx="18"/>
  <text class="h" x="555" y="404">xmemory</text>
  <text class="body" x="555" y="433">Persistent cases + reusable lessons</text>

  <path class="arrow" d="M300 230 H380"/>
  <text class="label" x="326" y="213">Scenario</text>

  <path class="arrow" d="M620 230 H700"/>
  <text class="label" x="647" y="213">Promotion</text>

  <path class="arrow" d="M940 230 H1020"/>
  <text class="label" x="968" y="213">Outcome</text>

  <path class="arrowMemory" d="M610 360 V325 H505 V300"/>
  <text class="memoryLabel" x="455" y="338">Past lessons</text>

  <path class="arrowMemory" d="M1155 290 V415 H840"/>
  <text class="memoryLabel" x="935" y="398">Cases + lessons</text>
</svg>
