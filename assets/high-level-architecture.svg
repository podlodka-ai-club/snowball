<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">High-level architecture of the self-learning FMCG promotion agent</title>
  <desc id="desc">Scenario inputs feed the promotion learning runtime. The Promotion Agent reads lessons from xmemory, the Evaluator writes cases and lessons, the Market Simulator supports counterfactual replay, and the Benchmark Runner compares clean and trained memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .zone{fill:#fff;stroke:#cbd5e1;stroke-width:2}.zoneRuntime{fill:#fff;stroke:#93c5fd;stroke-width:2.5}.zoneMem{fill:#fff;stroke:#c4b5fd;stroke-width:2.5}.zoneBench{fill:#fff;stroke:#a7f3d0;stroke-width:2.5}
      .zoneTitle{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:2}.nodeBlue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}.nodeOrange{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.5}.nodePurple{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}.nodeGreen{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5}
      .h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.small{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.purple{fill:#6d28d9}.orange{fill:#b45309}.green{fill:#047857}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.arrowBlue{fill:none;stroke:#2563eb;stroke-width:2.7;marker-end:url(#arrowBlue)}.arrowPurple{fill:none;stroke:#7c3aed;stroke-width:2.7;marker-end:url(#arrowPurple)}.arrowOrange{fill:none;stroke:#d97706;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowOrange)}.arrowGreen{fill:none;stroke:#059669;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#arrowGreen)}
      .pill{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}.pillText{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4338ca;letter-spacing:.4px}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" rx="24"/>
  <text class="title" x="54" y="58">Self-Learning FMCG Promotion Agent · High-Level Architecture</text>
  <text class="subtitle" x="54" y="88">Logical service boundaries for the MVP. Deployment can remain a single application process.</text>

  <rect class="zone" x="54" y="145" width="250" height="420" rx="18"/>
  <text class="zoneTitle" x="78" y="178">SCENARIO INPUTS</text>
  <rect class="node" x="78" y="210" width="202" height="108" rx="14"/>
  <text class="h" x="98" y="244">Historical / Synthetic</text>
  <text class="h" x="98" y="267">Sales Baseline</text>
  <text class="body" x="98" y="294">price · cost · stock · sales</text>
  <rect class="node" x="78" y="350" width="202" height="126" rx="14"/>
  <text class="h" x="98" y="384">Simulated External</text>
  <text class="h" x="98" y="407">Conditions</text>
  <text class="body" x="98" y="435">weather · day · local event</text>
  <text class="body" x="98" y="458">controlled hidden context</text>

  <rect class="zoneRuntime" x="340" y="145" width="875" height="420" rx="18"/>
  <text class="zoneTitle" x="364" y="178">PROMOTION LEARNING RUNTIME</text>
  <rect class="nodeBlue" x="374" y="245" width="190" height="128" rx="14"/>
  <text class="h" x="396" y="282">Scenario Generator</text>
  <text class="small" x="396" y="306">SERVICE</text>
  <text class="body" x="396" y="337">Build normalized</text>
  <text class="body" x="396" y="358">PromotionScenario</text>
  <rect class="nodeBlue" x="608" y="245" width="190" height="128" rx="14"/>
  <text class="h" x="630" y="282">Promotion Agent</text>
  <text class="small" x="630" y="306">AI AGENT</text>
  <text class="body" x="630" y="337">Choose one action</text>
  <text class="body" x="630" y="358">0 / 10 / 20 / 30%</text>
  <rect class="node" x="842" y="245" width="190" height="128" rx="14"/>
  <text class="h" x="864" y="282">Market Simulator</text>
  <text class="small" x="864" y="306">SERVICE</text>
  <text class="body" x="864" y="337">Hidden demand model</text>
  <text class="body" x="864" y="358">sales + gross profit</text>
  <rect class="nodeOrange" x="1076" y="245" width="105" height="128" rx="14"/>
  <text class="h" x="1094" y="279">Evaluator</text>
  <text class="h" x="1094" y="300">/ Learner</text>
  <text class="small" x="1094" y="323">AI + LOGIC</text>
  <text class="body" x="1094" y="350">regret</text>

  <path class="arrowBlue" d="M280 264 H342 Q360 264 374 284"/>
  <text class="small" x="295" y="250">baseline</text>
  <path class="arrowBlue" d="M280 413 H330 Q350 413 350 330 Q350 309 374 309"/>
  <text class="small" x="292" y="398">conditions</text>
  <path class="arrowBlue" d="M564 309 H598"/>
  <text class="small" x="568" y="294">scenario</text>
  <path class="arrow" d="M798 309 H832"/>
  <text class="small" x="806" y="294">decision</text>
  <path class="arrow" d="M1032 309 H1066"/>
  <text class="small" x="1038" y="294">outcome</text>
  <path class="arrow" d="M469 373 V428 H937 V383"/>
  <text class="small" x="618" y="419">scenario context</text>
  <path class="arrowOrange" d="M1128 373 V470 H937 V383"/>
  <rect class="pill" x="870" y="448" width="244" height="30" rx="15"/>
  <text class="pillText" x="889" y="468">COUNTERFACTUAL REPLAY · ALL ACTIONS</text>

  <rect class="zoneMem" x="1250" y="145" width="296" height="420" rx="18"/>
  <text class="zoneTitle" x="1274" y="178">PERSISTENT MEMORY</text>
  <rect class="nodePurple" x="1286" y="215" width="224" height="112" rx="18"/>
  <text class="h" x="1310" y="252">xmemory</text>
  <text class="small purple" x="1310" y="276">MEMORY SERVICE</text>
  <text class="body" x="1310" y="302">durable across restarts</text>
  <rect class="node" x="1286" y="362" width="104" height="86" rx="13"/>
  <text class="h" x="1303" y="397">Cases</text>
  <text class="body" x="1303" y="421">decision +</text>
  <text class="body" x="1303" y="440">outcome</text>
  <rect class="node" x="1406" y="362" width="104" height="86" rx="13"/>
  <text class="h" x="1421" y="397">Lessons</text>
  <text class="body" x="1421" y="421">reusable</text>
  <text class="body" x="1421" y="440">knowledge</text>
  <path class="arrowPurple" d="M1398 327 V347 H1338 V352"/>
  <path class="arrowPurple" d="M1398 327 V347 H1458 V352"/>
  <path class="arrowPurple" d="M1286 249 H1198 V212 H703 V235"/>
  <text class="small purple" x="934" y="200">READ relevant lessons before decision</text>
  <path class="arrowPurple" d="M1181 329 H1224 Q1240 329 1250 309 Q1260 287 1286 287"/>
  <text class="small purple" x="1189" y="346">WRITE case + lesson</text>

  <rect class="zoneBench" x="340" y="620" width="1206" height="210" rx="18"/>
  <text class="zoneTitle" x="364" y="653">BENCHMARK / EVALUATION</text>
  <rect class="nodeGreen" x="392" y="687" width="240" height="100" rx="14"/>
  <text class="h" x="414" y="724">Benchmark Runner</text>
  <text class="small green" x="414" y="748">EVALUATION SERVICE</text>
  <text class="body" x="414" y="773">same agent · same scenarios</text>
  <rect class="nodeGreen" x="1095" y="678" width="382" height="116" rx="14"/>
  <text class="h" x="1118" y="714">Comparison Metrics</text>
  <text class="body" x="1118" y="741">optimal action rate · average regret · gross profit</text>
  <text class="body" x="1118" y="765">memory retrieval hit rate</text>
  <path class="arrowGreen" d="M512 687 V590 H469 V383"/>
  <text class="small green" x="524" y="596">fixed scenario suite</text>
  <path class="arrowGreen" d="M632 736 H1010 Q1040 736 1040 610 V531 H1250"/>
  <text class="small green" x="742" y="722">baseline: clean memory · learned: trained memory</text>
  <path class="arrowGreen" d="M1128 373 V590 H1286 V668"/>
  <text class="small green" x="1140" y="585">regret + outcome data</text>
  <path class="arrowGreen" d="M632 755 H1085"/>

  <line x1="54" y1="862" x2="91" y2="862" class="arrowBlue"/>
  <text class="small" x="104" y="866">runtime data flow</text>
  <line x1="260" y1="862" x2="297" y2="862" class="arrowPurple"/>
  <text class="small" x="310" y="866">memory read / write</text>
  <line x1="472" y1="862" x2="509" y2="862" class="arrowOrange"/>
  <text class="small" x="522" y="866">counterfactual replay</text>
  <line x1="690" y1="862" x2="727" y2="862" class="arrowGreen"/>
  <text class="small" x="740" y="866">benchmark control / metrics</text>
</svg>
