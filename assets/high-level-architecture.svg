<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="600" viewBox="0 0 1700 600" role="img" aria-labelledby="title desc">
  <title id="title">Self-learning FMCG promotion agent architecture</title>
  <desc id="desc">Market data enters the Scenario Generator and scenario Kafka topic. The Promotion Agent reads persistent lessons from xmemory and publishes a decision to a second Kafka topic. Market Simulator and Evaluator share one simulation and learning runtime: the simulator produces a versioned outcome and the evaluator replays all four actions through the same hidden engine before writing cases and lessons to xmemory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="arrowMemory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="arrowReplay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.node{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}.agent{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}.memory{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}.eval{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.5}.engine{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5}.runtime{fill:#ffffff;fill-opacity:.45;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.label{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.memoryLabel{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d28d9}.replayLabel{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b45309}.runtimeLabel{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.arrowMemory{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrowMemory)}.arrowReplay{fill:none;stroke:#f59e0b;stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#arrowReplay)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1700" height="600" rx="24"/>
  <text class="title" x="48" y="54">Self-Learning FMCG Promotion Agent</text>
  <text class="subtitle" x="48" y="84">market data → scenario event → memory-backed decision → hidden deterministic market → evaluation → durable learning</text>

  <rect class="node" x="28" y="190" width="160" height="106" rx="16"/>
  <text class="h" x="48" y="230">Market Data</text><text class="body" x="48" y="254">prepared fixture</text>

  <rect class="node" x="218" y="190" width="180" height="106" rx="16"/>
  <text class="h" x="238" y="230">Scenario Generator</text><text class="body" x="238" y="254">normalize + publish</text>

  <rect class="memory" x="428" y="190" width="190" height="106" rx="16"/>
  <text class="h" x="448" y="228">Kafka</text><text class="body" x="448" y="252">promotion.scenarios.v1</text>

  <rect class="agent" x="648" y="190" width="180" height="106" rx="16"/>
  <text class="h" x="668" y="228">Promotion Agent</text><text class="body" x="668" y="252">retrieve + choose</text><text class="body" x="668" y="271">journal idempotently</text>

  <rect class="memory" x="858" y="190" width="190" height="106" rx="16"/>
  <text class="h" x="878" y="228">Kafka</text><text class="body" x="878" y="252">promotion.decisions.v1</text>

  <rect class="runtime" x="1080" y="135" width="585" height="235" rx="20"/>
  <text class="runtimeLabel" x="1100" y="160">SIMULATION + LEARNING RUNTIME · ONE SPRING BOOT PROCESS</text>

  <rect class="engine" x="1110" y="190" width="215" height="106" rx="16"/>
  <text class="h" x="1132" y="226">Market Simulator</text><text class="body" x="1132" y="250">hidden SimulationEngine</text><text class="body" x="1132" y="269">SIMULATOR_VERSION=v1</text>

  <rect class="eval" x="1410" y="190" width="220" height="106" rx="16"/>
  <text class="h" x="1432" y="226">Evaluator / Learner</text><text class="body" x="1432" y="250">replay + regret</text><text class="body" x="1432" y="269">case + lesson</text>

  <rect class="memory" x="675" y="430" width="330" height="105" rx="18"/>
  <text class="h" x="700" y="470">xmemory</text><text class="body" x="700" y="496">PromotionCases + reusable Lessons</text><text class="body" x="700" y="515">persistent across restarts</text>

  <path class="arrow" d="M188 243 H208"/>
  <path class="arrowMemory" d="M398 243 H418"/>
  <path class="arrowMemory" d="M618 243 H638"/>
  <path class="arrowMemory" d="M828 243 H848"/>
  <path class="arrowMemory" d="M1048 243 H1100"/>
  <path class="arrow" d="M1325 243 H1400"/>
  <text class="label" x="1337" y="229">PromotionOutcomeV1</text>

  <path class="arrowReplay" d="M1510 296 V334 H1218 V306"/>
  <text class="replayLabel" x="1295" y="352">replay 0 / 10 / 20 / 30 through same engine</text>

  <path class="arrowMemory" d="M780 430 V350 H738 V306"/>
  <text class="memoryLabel" x="682" y="388">past Lessons</text>

  <path class="arrowMemory" d="M1520 296 V482 H1015"/>
  <text class="memoryLabel" x="1160" y="463">cases + lessons</text>
</svg>
