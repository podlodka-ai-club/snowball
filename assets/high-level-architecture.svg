<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="560" viewBox="0 0 1700 560" role="img" aria-labelledby="title desc">
  <title id="title">Self-learning FMCG promotion agent architecture</title>
  <desc id="desc">Market data enters the Scenario Generator and then a scenario Kafka topic. The Promotion Agent reads persistent lessons from xmemory, publishes a decision event to a second Kafka topic, the Market Simulator produces an outcome, and the Evaluator writes cases and lessons back to xmemory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="arrowMemory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.node{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}.agent{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}.memory{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}.eval{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.5}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.label{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.memoryLabel{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d28d9}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.arrowMemory{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrowMemory)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1700" height="560" rx="24"/>
  <text class="title" x="54" y="58">Self-Learning FMCG Promotion Agent</text>
  <text class="subtitle" x="54" y="88">market data → scenario event → memory-backed decision → decision event → outcome → learning → memory</text>

  <rect class="node" x="35" y="180" width="175" height="110" rx="16"/>
  <text class="h" x="58" y="222">Market Data</text><text class="body" x="58" y="249">prepared fixture</text>

  <rect class="node" x="245" y="180" width="195" height="110" rx="16"/>
  <text class="h" x="268" y="222">Scenario Generator</text><text class="body" x="268" y="249">normalize + publish</text>

  <rect class="memory" x="475" y="180" width="205" height="110" rx="16"/>
  <text class="h" x="498" y="220">Kafka</text><text class="body" x="498" y="246">promotion.scenarios.v1</text>

  <rect class="agent" x="715" y="180" width="195" height="110" rx="16"/>
  <text class="h" x="738" y="220">Promotion Agent</text><text class="body" x="738" y="246">retrieve + choose</text><text class="body" x="738" y="266">journal idempotently</text>

  <rect class="memory" x="945" y="180" width="205" height="110" rx="16"/>
  <text class="h" x="968" y="220">Kafka</text><text class="body" x="968" y="246">promotion.decisions.v1</text>

  <rect class="node" x="1185" y="180" width="195" height="110" rx="16"/>
  <text class="h" x="1208" y="220">Market Simulator</text><text class="body" x="1208" y="246">hidden market world</text>

  <rect class="eval" x="1415" y="180" width="230" height="110" rx="16"/>
  <text class="h" x="1438" y="220">Evaluator / Learner</text><text class="body" x="1438" y="246">replay + regret + lesson</text>

  <rect class="memory" x="770" y="385" width="330" height="105" rx="18"/>
  <text class="h" x="795" y="425">xmemory</text><text class="body" x="795" y="451">PromotionCases + reusable Lessons</text><text class="body" x="795" y="470">persistent across restarts</text>

  <path class="arrow" d="M210 235 H235"/><path class="arrowMemory" d="M440 235 H465"/><path class="arrowMemory" d="M680 235 H705"/><path class="arrowMemory" d="M910 235 H935"/><path class="arrowMemory" d="M1150 235 H1175"/><path class="arrow" d="M1380 235 H1405"/>
  <path class="arrowMemory" d="M850 385 V330 H812 V300"/><text class="memoryLabel" x="735" y="352">past Lessons</text>
  <path class="arrowMemory" d="M1530 290 V438 H1110"/><text class="memoryLabel" x="1180" y="420">cases + lessons</text>
</svg>
