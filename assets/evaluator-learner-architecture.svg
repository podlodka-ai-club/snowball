<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="title desc">
  <title id="title">Evaluator / Learner architecture</title>
  <desc id="desc">The Market Simulator produces a chosen outcome. Evaluator replays four discounts using the same simulation engine, calculates oracle and regret, emits evaluation metrics, creates immutable PromotionCase evidence, and Learner recomputes two deterministic Lesson buckets in xmemory. Benchmark mode disables xmemory writes while retaining evaluation metrics.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#f59e0b"/></marker>
    <style>
      .bg{fill:#f8fafc}.runtime{fill:#fff;fill-opacity:.35;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.sim{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5}.eval{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.5}.learn{fill:#fefce8;stroke:#ca8a04;stroke-width:2.5}.mem{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.5}.case{fill:#fff;stroke:#64748b;stroke-width:2.5}.bench{fill:#fef2f2;stroke:#ef4444;stroke-width:2.5}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.b{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.small{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.arr{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}.purple{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#p)}.orange{fill:none;stroke:#f59e0b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#o)}
    </style>
  </defs>
  <rect class="bg" width="1800" height="700" rx="24"/>
  <text class="title" x="52" y="58">Evaluator / Learner</text>
  <text class="sub" x="52" y="86">objective replay  -&gt;  immutable evidence  -&gt;  deterministic aggregation  -&gt;  durable Lessons</text>

  <rect class="runtime" x="250" y="130" width="1240" height="390" rx="22"/>
  <text class="small" x="275" y="155">ONE KOTLIN / SPRING BOOT DEPLOYABLE · SEPARATE LOGICAL COMPONENTS</text>

  <rect class="sim" x="55" y="230" width="165" height="105" rx="16"/>
  <text class="h" x="78" y="268">Kafka</text><text class="b" x="78" y="293">promotion.decisions.v1</text>

  <rect class="sim" x="285" y="210" width="190" height="145" rx="16"/>
  <text class="h" x="307" y="249">Market Simulator</text><text class="b" x="307" y="275">chosen action only</text><text class="b" x="307" y="296">scope ends at outcome</text><text class="b" x="307" y="320">SIMULATOR_VERSION=v1</text>

  <rect class="sim" x="535" y="170" width="200" height="90" rx="16"/>
  <text class="h" x="558" y="207">SimulationEngine</text><text class="b" x="558" y="231">pure deterministic capability</text>

  <rect class="case" x="535" y="315" width="200" height="90" rx="16"/>
  <text class="h" x="558" y="352">PromotionOutcomeV1</text><text class="b" x="558" y="376">chosen units + gross profit</text>

  <rect class="eval" x="800" y="225" width="205" height="125" rx="16"/>
  <text class="h" x="823" y="261">Evaluator</text><text class="b" x="823" y="286">replay 0 / 10 / 20 / 30</text><text class="b" x="823" y="307">oracle + regret</text><text class="b" x="823" y="328">exact-cent tie-break</text>

  <rect class="case" x="1070" y="180" width="210" height="105" rx="16"/>
  <text class="h" x="1092" y="217">PromotionCase</text><text class="b" x="1092" y="242">immutable evaluated evidence</text><text class="b" x="1092" y="262">CASE-v1-&lt;scenario_id&gt;</text>

  <rect class="eval" x="1070" y="355" width="210" height="95" rx="16"/>
  <text class="h" x="1092" y="392">EvaluationObserver</text><text class="b" x="1092" y="416">metrics + causal trace</text>

  <rect class="learn" x="1330" y="190" width="140" height="160" rx="16"/>
  <text class="h" x="1352" y="227">Learner</text><text class="b" x="1352" y="252">2 buckets</text><text class="b" x="1352" y="274">SKU + category</text><text class="b" x="1352" y="298">recompute from</text><text class="b" x="1352" y="320">linked evidence</text>

  <rect class="mem" x="1530" y="180" width="230" height="145" rx="18"/>
  <text class="h" x="1553" y="217">xmemory</text><text class="b" x="1553" y="242">SKU · PromotionCase · Lesson</text><text class="b" x="1553" y="264">lesson_evidence provenance</text><text class="b" x="1553" y="286">durable across restarts</text>

  <rect class="bench" x="1330" y="405" width="430" height="105" rx="16"/>
  <text class="h" x="1353" y="442">Benchmark Runner</text><text class="b" x="1353" y="466">LEARNING_ENABLED=false</text><text class="b" x="1353" y="487">collect EvaluationSummary · no xmemory writes</text>

  <path class="arr" d="M220 283 H275"/>
  <path class="arr" d="M475 330 H525"/>
  <path class="arr" d="M735 360 H790"/>
  <path class="orange" d="M902 225 V190 H745"/>
  <text class="small" x="775" y="179">counterfactual replay</text>
  <path class="arr" d="M1005 260 H1060"/>
  <path class="arr" d="M1005 318 H1035 V402 H1060"/>
  <path class="arr" d="M1280 232 H1320"/>
  <path class="purple" d="M1280 205 H1510 V218 H1520"/>
  <path class="purple" d="M1470 270 H1520"/>
  <path class="purple" d="M1530 305 H1500 V365 H1400 V360"/>
  <text class="small" x="1420" y="382">evidence read</text>
  <path class="arr" d="M1280 402 H1320"/>
  <text class="small" x="1288" y="392">EvaluationSummary</text>

  <text class="sub" x="285" y="565">Training: 200–300 scenarios, learning enabled</text>
  <text class="sub" x="285" y="595">Benchmark: same fixed 50 scenarios, clean vs trained memory, learning disabled</text>
  <text class="sub" x="285" y="625">No outcome Kafka topic. No LLM arithmetic. No hidden simulator coefficients in xmemory.</text>
</svg>
