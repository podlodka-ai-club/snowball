<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">Evaluator Learner simple overview</title>
  <desc id="desc">One completed promotion is evaluated across four discounts, stored as one PromotionCase, and used to recompute one SKU Lesson and one category Lesson in xmemory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker>
    <style>
      .bg{fill:#f8fafc}.input{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}.eval{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.5}.case{fill:#fff;stroke:#64748b;stroke-width:2.5}.learn{fill:#fefce8;stroke:#ca8a04;stroke-width:2.5}.mem{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.5}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.b{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.num{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.badge{fill:#475569}.arr{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.parr{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#purple)}
    </style>
  </defs>
  <rect class="bg" width="1500" height="520" rx="24"/>
  <text class="title" x="48" y="58">Evaluator / Learner: one job</text>
  <text class="sub" x="48" y="88">finished promotion → compare all choices → save experience → improve reusable memory</text>

  <rect class="input" x="45" y="175" width="230" height="145" rx="18"/>
  <circle class="badge" cx="72" cy="201" r="15"/><text class="num" x="68" y="206">1</text>
  <text class="h" x="95" y="207">Completed promotion</text>
  <text class="b" x="70" y="242">Hot weekend · high stock</text>
  <text class="b" x="70" y="266">Agent chose 10%</text>
  <text class="b" x="70" y="290">Chosen profit £252</text>

  <rect class="eval" x="325" y="155" width="245" height="185" rx="18"/>
  <circle class="badge" cx="352" cy="181" r="15"/><text class="num" x="348" y="186">2</text>
  <text class="h" x="375" y="187">Evaluator</text>
  <text class="b" x="350" y="222">Replay same scenario:</text>
  <text class="b" x="350" y="247">0% → £240</text>
  <text class="b" x="350" y="270">10% → £252</text>
  <text class="b" x="350" y="293">20% → £281  ✓ best</text>
  <text class="b" x="350" y="316">30% → £263</text>

  <rect class="case" x="620" y="175" width="230" height="145" rx="18"/>
  <circle class="badge" cx="647" cy="201" r="15"/><text class="num" x="643" y="206">3</text>
  <text class="h" x="670" y="207">PromotionCase</text>
  <text class="b" x="645" y="242">Chosen: 10%</text>
  <text class="b" x="645" y="266">Best: 20%</text>
  <text class="b" x="645" y="290">Regret: £29</text>

  <rect class="learn" x="900" y="155" width="245" height="185" rx="18"/>
  <circle class="badge" cx="927" cy="181" r="15"/><text class="num" x="923" y="186">4</text>
  <text class="h" x="950" y="187">Learner</text>
  <text class="b" x="925" y="225">Add case to exactly 2 buckets:</text>
  <text class="b" x="925" y="254">• ICE500 + hot weekend + high</text>
  <text class="b" x="925" y="281">• ice_cream + hot weekend + high</text>
  <text class="b" x="925" y="313">Recompute from all linked cases</text>

  <rect class="mem" x="1195" y="175" width="255" height="145" rx="18"/>
  <circle class="badge" cx="1222" cy="201" r="15"/><text class="num" x="1218" y="206">5</text>
  <text class="h" x="1245" y="207">xmemory</text>
  <text class="b" x="1220" y="242">PromotionCase saved</text>
  <text class="b" x="1220" y="266">SKU Lesson updated</text>
  <text class="b" x="1220" y="290">Category Lesson updated</text>

  <path class="arr" d="M275 248 H315"/>
  <path class="arr" d="M570 248 H610"/>
  <path class="arr" d="M850 248 H890"/>
  <path class="parr" d="M1145 248 H1185"/>

  <rect x="325" y="390" width="1125" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="350" y="420">Result:</text>
  <text class="b" x="420" y="420">one real experience became durable evidence and updated reusable advice for the next similar promotion.</text>
  <text class="b" x="350" y="445">No free-form lesson per case. No LLM arithmetic. Recommendation comes from accumulated counterfactual profits.</text>
</svg>
