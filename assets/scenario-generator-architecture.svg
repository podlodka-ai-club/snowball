<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Scenario Generator architecture</title>
  <desc id="desc">A Kotlin Scenario Generator reads a prepared dunnhumby baseline through an adapter, applies the fixed London Central market configuration and deterministic context, validates the scenario, and publishes it to Kafka for the Promotion Agent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowKafka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .source{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .service{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}
      .port{fill:#fff;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 6}
      .kafka{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}
      .config{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5}
      .h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .kafkaLabel{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d28d9}
      .arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .arrowKafka{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrowKafka)}
      .group{fill:none;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 8}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="760" rx="24"/>
  <text class="title" x="54" y="58">Scenario Generator: source adapters → stable Kafka contract</text>
  <text class="subtitle" x="54" y="88">Hackathon market is fixed to London Central; the data-source boundary stays replaceable.</text>

  <rect class="group" x="55" y="135" width="355" height="475" rx="20"/>
  <text class="label" x="80" y="165">DATA ACQUISITION</text>

  <rect class="source" x="85" y="200" width="130" height="90" rx="14"/>
  <text class="h" x="103" y="238">dunnhumby</text>
  <text class="body" x="101" y="264">prepared fixture</text>

  <rect class="source" x="250" y="200" width="130" height="90" rx="14"/>
  <text class="h" x="282" y="238">Future</text>
  <text class="body" x="274" y="264">SAP · DB · API</text>

  <rect class="source" x="85" y="335" width="130" height="105" rx="14"/>
  <text class="h" x="103" y="373">Dataset</text>
  <text class="h" x="103" y="397">Adapter</text>
  <text class="body" x="103" y="423">MVP</text>

  <rect class="source" x="250" y="335" width="130" height="105" rx="14"/>
  <text class="h" x="266" y="373">Source</text>
  <text class="h" x="266" y="397">Adapter</text>
  <text class="body" x="266" y="423">later</text>

  <rect class="port" x="105" y="485" width="250" height="90" rx="14"/>
  <text class="h" x="132" y="523">BaselineSource port</text>
  <text class="body" x="132" y="550">normalized baseline records</text>

  <path class="arrow" d="M150 290 V325"/>
  <path class="arrow" d="M315 290 V325"/>
  <path class="arrow" d="M150 440 V475 H215"/>
  <path class="arrow" d="M315 440 V475 H245"/>

  <rect class="group" x="455" y="135" width="610" height="475" rx="20"/>
  <text class="label" x="480" y="165">KOTLIN SCENARIO GENERATOR</text>

  <rect class="service" x="500" y="205" width="220" height="100" rx="16"/>
  <text class="h" x="525" y="245">Trigger</text>
  <text class="body" x="525" y="272">scheduler + manual endpoint</text>

  <rect class="config" x="500" y="325" width="220" height="62" rx="14"/>
  <text class="h" x="525" y="352">MarketConfig</text>
  <text class="body" x="525" y="375">London Central · Europe/London</text>

  <rect class="source" x="500" y="410" width="220" height="105" rx="16"/>
  <text class="h" x="525" y="448">ContextEnricher</text>
  <text class="body" x="525" y="475">weather · event · day type</text>
  <text class="small" x="525" y="500">deterministic now</text>

  <rect class="service" x="780" y="205" width="240" height="140" rx="16"/>
  <text class="h" x="805" y="245">ScenarioGenerationService</text>
  <text class="small" x="805" y="278">fetch baseline</text>
  <text class="small" x="805" y="302">inject fixed market</text>
  <text class="small" x="805" y="326">enrich context</text>

  <rect class="service" x="780" y="385" width="240" height="145" rx="16"/>
  <text class="h" x="805" y="425">Normalize + Validate</text>
  <text class="small" x="805" y="458">derive stock/day buckets</text>
  <text class="small" x="805" y="482">deterministic scenario_id</text>
  <text class="small" x="805" y="506">validate JSON contract</text>

  <path class="arrow" d="M720 255 H770"/>
  <path class="arrow" d="M720 356 H755 Q770 356 780 330"/>
  <path class="arrow" d="M610 387 V400"/>
  <path class="arrow" d="M720 462 H745 Q765 462 780 435"/>
  <path class="arrow" d="M900 345 V375"/>
  <path class="arrow" d="M355 530 H740 Q760 530 780 510"/>

  <rect class="service" x="1115" y="250" width="245" height="110" rx="16"/>
  <text class="h" x="1140" y="292">KafkaScenarioPublisher</text>
  <text class="body" x="1140" y="321">one scenario per message</text>
  <text class="small" x="1140" y="344">at-least-once</text>

  <rect class="kafka" x="1115" y="430" width="245" height="115" rx="18"/>
  <text class="h" x="1140" y="472">promotion.scenarios.v1</text>
  <text class="body" x="1140" y="500">JSON · schema version 1</text>
  <text class="small" x="1140" y="525">key: store_id:sku_id</text>

  <rect class="service" x="1115" y="625" width="245" height="85" rx="16"/>
  <text class="h" x="1140" y="663">Promotion Agent</text>
  <text class="body" x="1140" y="688">depends only on contract</text>

  <path class="arrow" d="M1020 455 H1080 Q1100 455 1115 360"/>
  <path class="arrowKafka" d="M1237 360 V420"/>
  <text class="kafkaLabel" x="1254" y="398">publish</text>
  <path class="arrowKafka" d="M1237 545 V615"/>
  <text class="kafkaLabel" x="1254" y="588">consume</text>
</svg>
