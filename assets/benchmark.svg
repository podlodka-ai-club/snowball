<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark clean memory versus trained memory</title>
  <desc id="desc">Benchmark Runner executes the same Promotion Agent with clean xmemory and trained xmemory, then compares optimal action rate, regret, and gross profit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .memory{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}
      .result{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5}
      .h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="470" rx="24"/>
  <text class="title" x="54" y="58">Benchmark: clean memory vs learned memory</text>
  <text class="subtitle" x="54" y="86">Same model, prompt, simulator and fixed scenarios. Only memory changes.</text>

  <rect class="node" x="70" y="185" width="200" height="100" rx="16"/>
  <text class="h" x="95" y="225">Benchmark Runner</text>
  <text class="body" x="95" y="251">Runs fixed scenarios</text>

  <rect class="memory" x="360" y="110" width="210" height="95" rx="16"/>
  <text class="h" x="385" y="149">Clean xmemory</text>
  <text class="body" x="385" y="176">Baseline</text>

  <rect class="memory" x="360" y="275" width="210" height="95" rx="16"/>
  <text class="h" x="385" y="314">Trained xmemory</text>
  <text class="body" x="385" y="341">Learned</text>

  <rect class="node" x="655" y="110" width="205" height="95" rx="16"/>
  <text class="h" x="680" y="149">Promotion Agent</text>
  <text class="body" x="680" y="176">Same agent</text>

  <rect class="node" x="655" y="275" width="205" height="95" rx="16"/>
  <text class="h" x="680" y="314">Promotion Agent</text>
  <text class="body" x="680" y="341">Same agent</text>

  <rect class="result" x="945" y="172" width="205" height="125" rx="16"/>
  <text class="h" x="970" y="211">Compare metrics</text>
  <text class="body" x="970" y="238">Optimal action rate</text>
  <text class="body" x="970" y="260">Average regret</text>
  <text class="body" x="970" y="282">Gross profit</text>

  <path class="arrow" d="M270 225 H315 V157 H350"/>
  <path class="arrow" d="M270 245 H315 V322 H350"/>
  <path class="arrow" d="M570 157 H645"/>
  <path class="arrow" d="M570 322 H645"/>
  <path class="arrow" d="M860 157 H905 V215 H935"/>
  <path class="arrow" d="M860 322 H905 V255 H935"/>
</svg>
