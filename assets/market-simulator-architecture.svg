<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="560" viewBox="0 0 1450 560" role="img" aria-labelledby="title desc">
  <title id="title">Market Simulator architecture</title>
  <desc id="desc">A promotion decision enters the Market Simulator boundary. DecisionListener validates it, SimulationEngine uses hidden versioned configuration and deterministic scenario noise, and the simulator outputs PromotionOutcomeV1. Evaluator and Learner are intentionally outside this diagram and outside Market Simulator scope.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.boundary{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.kafka{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}.listener{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}.engine{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5}.outcome{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}.config{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.label{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.boundaryLabel{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1450" height="560" rx="24"/>
  <text class="title" x="52" y="58">Market Simulator</text>
  <text class="subtitle" x="52" y="89">hidden deterministic market world; scope ends at PromotionOutcomeV1</text>

  <rect class="kafka" x="45" y="220" width="220" height="112" rx="16"/>
  <text class="h" x="70" y="261">Kafka</text>
  <text class="body" x="70" y="287">promotion.decisions.v1</text>
  <text class="body" x="70" y="307">group: market-simulator-v1</text>

  <rect class="boundary" x="315" y="120" width="1080" height="330" rx="22"/>
  <text class="boundaryLabel" x="340" y="148">MARKET SIMULATOR BOUNDARY</text>

  <rect class="listener" x="360" y="220" width="220" height="112" rx="16"/>
  <text class="h" x="383" y="259">DecisionListener</text>
  <text class="body" x="383" y="284">schema + invariant validation</text>
  <text class="body" x="383" y="304">manual Kafka acknowledgement</text>

  <rect class="engine" x="650" y="220" width="240" height="112" rx="16"/>
  <text class="h" x="675" y="257">SimulationEngine</text>
  <text class="body" x="675" y="282">pure deterministic function</text>
  <text class="body" x="675" y="302">stock cap + gross profit</text>

  <rect class="outcome" x="1010" y="220" width="300" height="112" rx="16"/>
  <text class="h" x="1035" y="257">PromotionOutcomeV1</text>
  <text class="body" x="1035" y="282">units_sold + gross_profit</text>
  <text class="body" x="1035" y="302">Market Simulator scope ends here</text>

  <rect class="config" x="590" y="365" width="255" height="62" rx="14"/>
  <text class="h" x="614" y="393">SimulatorV1Config</text>
  <text class="body" x="614" y="414">hidden coefficients · versioned</text>

  <rect class="config" x="870" y="365" width="280" height="62" rx="14"/>
  <text class="h" x="895" y="393">Deterministic scenario noise</text>
  <text class="body" x="895" y="414">SHA-256(v1|scenario_id)</text>

  <path class="arrow" d="M265 276 H350"/>
  <path class="arrow" d="M580 276 H640"/>
  <path class="arrow" d="M890 276 H1000"/>
  <path class="arrow" d="M718 365 V342"/>
  <path class="arrow" d="M1010 365 V342 H790"/>
  <text class="label" x="1015" y="201">versioned business outcome</text>
</svg>
