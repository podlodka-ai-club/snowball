<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2200" viewBox="0 0 1200 2200" role="img" aria-labelledby="title desc">
  <title id="title">Promotion Agent runtime decision flow</title>
  <desc id="desc">The Promotion Agent consumes and validates a scenario, checks durable idempotency state, retrieves and ranks xmemory lessons, asks the decision model for one discount, validates or falls back, persists the exact decision, publishes it to Kafka, and commits the source offset.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .box{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.2}.mem{fill:#ecfdf5;stroke:#10b981;stroke-width:2.2}.journal{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.2}.fail{fill:#fef2f2;stroke:#ef4444;stroke-width:2.2}.neutral{fill:#fff;stroke:#94a3b8;stroke-width:2}.diamond{fill:#fff;stroke:#64748b;stroke-width:2}.note{fill:#fff;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 5}
      .h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.label{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="2200" rx="24"/>
  <text class="title" x="50" y="55">Promotion Agent — Runtime Decision Flow</text>
  <text class="sub" x="50" y="83">scenario → idempotency → memory → model → durable decision → Kafka</text>
  <circle cx="600" cy="125" r="10" fill="#0ea5e9"/>
  <path class="arrow" d="M600 136V165"/>
  <rect class="box" x="410" y="165" width="380" height="76" rx="14"/>
  <text class="h" x="600" y="195" text-anchor="middle">Consume PromotionScenario</text><text class="t" x="600" y="220" text-anchor="middle">promotion.scenarios.v1</text>
  <path class="arrow" d="M600 241V270"/>
  <rect class="box" x="410" y="270" width="380" height="76" rx="14"/>
  <text class="h" x="600" y="300" text-anchor="middle">Deserialize + validate</text><text class="t" x="600" y="325" text-anchor="middle">PromotionScenario v1</text>
  <path class="arrow" d="M600 346V375"/>
  <polygon class="diamond" points="600,375 705,425 600,475 495,425"/><text class="h" x="600" y="430" text-anchor="middle">Valid?</text>
  <path class="arrow" d="M495 425H310V490"/><text class="label" x="420" y="413">no</text>
  <rect class="neutral" x="120" y="490" width="380" height="76" rx="14"/>
  <text class="h" x="310" y="520" text-anchor="middle">Reject malformed scenario</text><text class="t" x="310" y="545" text-anchor="middle">log + acknowledge source offset</text>
  <path class="arrow" d="M600 475V510"/><text class="label" x="615" y="498">yes</text>
  <rect class="journal" x="410" y="510" width="380" height="76" rx="14"/>
  <text class="h" x="600" y="540" text-anchor="middle">DecisionJournal lookup</text><text class="t" x="600" y="565" text-anchor="middle">scenario_id in file-backed H2</text>
  <path class="arrow" d="M600 586V615"/>
  <polygon class="diamond" points="600,615 720,665 600,715 480,665"/><text class="h" x="600" y="660" text-anchor="middle">COMPLETED?</text><text class="small" x="600" y="682" text-anchor="middle">already processed</text>
  <path class="arrow" d="M480 665H310V730"/><text class="label" x="405" y="653">yes</text>
  <rect class="journal" x="120" y="730" width="380" height="82" rx="14"/>
  <text class="h" x="310" y="760" text-anchor="middle">Skip duplicate</text><text class="t" x="310" y="785" text-anchor="middle">no xmemory/model call · ack offset</text>
  <path class="arrow" d="M600 715V745"/><text class="label" x="615" y="735">no</text>
  <polygon class="diamond" points="600,745 720,795 600,845 480,795"/><text class="h" x="600" y="790" text-anchor="middle">DECIDED?</text><text class="small" x="600" y="812" text-anchor="middle">decision saved, not completed</text>
  <path class="arrow" d="M720 795H900V850"/><text class="label" x="805" y="783">yes</text>
  <rect class="journal" x="760" y="850" width="380" height="90" rx="14"/>
  <text class="h" x="950" y="880" text-anchor="middle">Republish stored decision</text><text class="t" x="950" y="905" text-anchor="middle">never call xmemory/model again</text><text class="small" x="950" y="925" text-anchor="middle">success → COMPLETED + ack; failure → keep DECIDED</text>
  <path class="arrow" d="M600 845V880"/><text class="label" x="615" y="865">no</text>
  <rect class="journal" x="410" y="880" width="380" height="68" rx="14"/><text class="h" x="600" y="920" text-anchor="middle">Create / keep STARTED row</text>
  <path class="arrow" d="M600 948V980"/>
  <rect class="mem" x="410" y="980" width="380" height="82" rx="14"/>
  <text class="h" x="600" y="1010" text-anchor="middle">Build xmemory query</text><text class="t" x="600" y="1035" text-anchor="middle">SKU + category + scenario context</text>
  <path class="arrow" d="M600 1062V1090"/>
  <rect class="mem" x="410" y="1090" width="380" height="82" rx="14"/>
  <text class="h" x="600" y="1120" text-anchor="middle">Retrieve candidate Lessons</text><text class="t" x="600" y="1145" text-anchor="middle">validate · filter · rank · take top &lt;= 3</text>
  <path class="arrow" d="M600 1172V1205"/>
  <rect class="note" x="825" y="1000" width="315" height="190" rx="14"/>
  <text class="h" x="850" y="1035">Model sees only</text><text class="t" x="850" y="1065">• normalized scenario</text><text class="t" x="850" y="1090">• [0, 10, 20, 30]</text><text class="t" x="850" y="1115">• top 3 compact Lessons</text>
  <text class="h" x="850" y="1150">Never sees</text><text class="t" x="850" y="1178">simulator coefficients / oracle / future outcome</text>
  <rect class="box" x="410" y="1205" width="380" height="82" rx="14"/>
  <text class="h" x="600" y="1235" text-anchor="middle">Build stable decision prompt</text><text class="t" x="600" y="1260" text-anchor="middle">same prompt for clean vs trained memory</text>
  <path class="arrow" d="M600 1287V1315"/>
  <rect class="box" x="410" y="1315" width="380" height="68" rx="14"/><text class="h" x="600" y="1357" text-anchor="middle">Call DecisionModel</text>
  <path class="arrow" d="M600 1383V1415"/>
  <polygon class="diamond" points="600,1415 735,1465 600,1515 465,1465"/><text class="h" x="600" y="1460" text-anchor="middle">Valid result?</text><text class="small" x="600" y="1482" text-anchor="middle">scenario_id + allowed discount</text>
  <path class="arrow" d="M735 1465H900V1515"/><text class="label" x="805" y="1453">no</text>
  <rect class="box" x="760" y="1515" width="380" height="82" rx="14"/>
  <text class="h" x="950" y="1545" text-anchor="middle">Retry once</text><text class="t" x="950" y="1570" text-anchor="middle">still invalid/fails → deterministic 0%</text>
  <path class="arrow" d="M950 1597V1640H790"/>
  <path class="arrow" d="M600 1515V1640"/><text class="label" x="615" y="1540">yes</text>
  <rect class="box" x="410" y="1640" width="380" height="82" rx="14"/>
  <text class="h" x="600" y="1670" text-anchor="middle">Build PromotionDecision</text><text class="t" x="600" y="1695" text-anchor="middle">exactly one discount: 0 / 10 / 20 / 30</text>
  <path class="arrow" d="M600 1722V1750"/>
  <rect class="journal" x="410" y="1750" width="380" height="82" rx="14"/>
  <text class="h" x="600" y="1780" text-anchor="middle">Persist exact event + trace</text><text class="t" x="600" y="1805" text-anchor="middle">journal state = DECIDED</text>
  <path class="arrow" d="M600 1832V1860"/>
  <rect class="box" x="410" y="1860" width="380" height="82" rx="14"/>
  <text class="h" x="600" y="1890" text-anchor="middle">Publish PromotionDecision</text><text class="t" x="600" y="1915" text-anchor="middle">promotion.decisions.v1</text>
  <path class="arrow" d="M600 1942V1970"/>
  <polygon class="diamond" points="600,1970 720,2020 600,2070 480,2020"/><text class="h" x="600" y="2025" text-anchor="middle">Publish ok?</text>
  <path class="arrow" d="M480 2020H310V2080"/><text class="label" x="405" y="2008">yes</text>
  <rect class="mem" x="120" y="2080" width="380" height="82" rx="14"/>
  <text class="h" x="310" y="2110" text-anchor="middle">Mark COMPLETED + ack</text><text class="t" x="310" y="2135" text-anchor="middle">log lesson_keys + selected discount</text>
  <path class="arrow" d="M720 2020H900V2080"/><text class="label" x="805" y="2008">no</text>
  <rect class="fail" x="760" y="2080" width="380" height="82" rx="14"/>
  <text class="h" x="950" y="2110" text-anchor="middle">Keep DECIDED · do not ack</text><text class="t" x="950" y="2135" text-anchor="middle">redelivery republishes the stored event</text>
</svg>
