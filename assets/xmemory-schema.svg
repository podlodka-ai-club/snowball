<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">xmemory schema for FMCG promotion agent</title>
  <desc id="desc">Three-object xmemory schema. SKU connects to evaluated PromotionCase evidence. Cases support reusable Lessons. Human corrections are stored inside each case. The evaluator writes cases and updates lessons, while the Promotion Agent retrieves lessons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowMemory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowHuman" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .entity{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .memory{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}
      .actor{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}
      .human{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.5}
      .h{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .memoryLabel{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d28d9}
      .humanLabel{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b45309}
      .arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .arrowMemory{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrowMemory)}
      .arrowHuman{fill:none;stroke:#d97706;stroke-width:3;marker-end:url(#arrowHuman)}
      .dashed{stroke-dasharray:8 7}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="680" rx="24"/>
  <text class="title" x="54" y="58">xmemory: three objects, one visible learning loop</text>
  <text class="subtitle" x="54" y="88">Human correction stays inside the case; only evaluated evidence becomes a reusable Lesson.</text>

  <rect class="entity" x="70" y="230" width="250" height="180" rx="16"/>
  <text class="h" x="95" y="270">SKU</text>
  <text class="body" x="95" y="300">PK: sku_id</text>
  <text class="small" x="95" y="333">category</text>
  <text class="small" x="95" y="360">base_price · cost</text>
  <text class="body" x="95" y="392">Stable product identity</text>

  <rect class="memory" x="455" y="170" width="420" height="300" rx="18"/>
  <text class="h" x="480" y="210">PromotionCase</text>
  <text class="body" x="480" y="240">PK: case_id · immutable evaluated evidence</text>
  <text class="small" x="480" y="275">Scenario</text>
  <text class="body" x="575" y="275">store · baseline · stock · day · weather · event</text>
  <text class="small" x="480" y="310">Decision</text>
  <text class="body" x="575" y="310">agent_discount → human_discount + reason</text>
  <text class="small" x="480" y="345">Outcome</text>
  <text class="body" x="575" y="345">units_sold · gross_profit · agent_gross_profit</text>
  <text class="small" x="480" y="380">Oracle</text>
  <text class="body" x="575" y="380">best_discount · best_gross_profit</text>
  <text class="small" x="480" y="415">Evaluation</text>
  <text class="body" x="575" y="415">agent_regret · applied_regret · human_profit_delta</text>
  <text class="body" x="480" y="448">Human opinion is stored; simulator evidence decides whether it teaches.</text>

  <rect class="memory" x="1035" y="190" width="300" height="260" rx="18"/>
  <text class="h" x="1060" y="230">Lesson</text>
  <text class="body" x="1060" y="260">PK: deterministic lesson_key</text>
  <text class="small" x="1060" y="295">scope + context conditions</text>
  <text class="small" x="1060" y="325">recommended_discount</text>
  <text class="small" x="1060" y="355">rationale</text>
  <text class="small" x="1060" y="385">evidence_count · confidence</text>
  <text class="small" x="1060" y="415">avg_profit_advantage_pct</text>
  <text class="body" x="1060" y="438">Updated as evidence accumulates</text>

  <rect class="human" x="455" y="535" width="250" height="90" rx="16"/>
  <text class="h" x="480" y="572">Category Manager</text>
  <text class="body" x="480" y="598">accept / change + reason</text>

  <rect class="actor" x="760" y="535" width="270" height="90" rx="16"/>
  <text class="h" x="785" y="572">Evaluator / Learner</text>
  <text class="body" x="785" y="598">oracle replay · write · update</text>

  <rect class="actor" x="1085" y="535" width="250" height="90" rx="16"/>
  <text class="h" x="1110" y="572">Promotion Agent</text>
  <text class="body" x="1110" y="598">retrieves top Lessons</text>

  <path class="arrow" d="M320 320 H445"/>
  <text class="label" x="340" y="302">case_sku</text>

  <path class="arrowMemory" d="M875 320 H1025"/>
  <text class="memoryLabel" x="895" y="302">lesson_evidence</text>

  <path class="arrowMemory dashed" d="M1080 190 Q900 105 320 250"/>
  <text class="memoryLabel" x="650" y="130">lesson_sku_scope · optional</text>

  <path class="arrowHuman" d="M580 535 V480"/>
  <text class="humanLabel" x="595" y="515">human decision</text>

  <path class="arrowMemory" d="M850 535 Q820 500 780 470"/>
  <text class="memoryLabel" x="825" y="505">write case</text>

  <path class="arrowMemory" d="M945 535 Q1015 505 1080 450"/>
  <text class="memoryLabel" x="985" y="500">update Lesson</text>

  <path class="arrowMemory" d="M1210 450 V525"/>
  <text class="memoryLabel" x="1226" y="495">retrieve</text>
</svg>
