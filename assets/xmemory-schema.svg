<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">xmemory schema for autonomous FMCG promotion agent</title>
  <desc id="desc">Three-object xmemory schema. SKU connects to evaluated PromotionCase evidence. Cases support reusable Lessons. The Promotion Agent chooses a discount, the Evaluator writes cases and updates lessons, and later decisions retrieve those lessons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowMemory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .entity{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .memory{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2.5}
      .actor{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}
      .h{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .memoryLabel{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d28d9}
      .arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .arrowMemory{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrowMemory)}
      .dashed{stroke-dasharray:8 7}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="620" rx="24"/>
  <text class="title" x="54" y="58">xmemory: three objects, one autonomous learning loop</text>
  <text class="subtitle" x="54" y="88">Decision → simulator outcome → counterfactual evaluation → Lesson → better next decision</text>

  <rect class="entity" x="70" y="210" width="250" height="180" rx="16"/>
  <text class="h" x="95" y="250">SKU</text>
  <text class="body" x="95" y="280">PK: sku_id</text>
  <text class="small" x="95" y="313">category</text>
  <text class="small" x="95" y="340">base_price · cost</text>
  <text class="body" x="95" y="372">Stable product identity</text>

  <rect class="memory" x="455" y="150" width="420" height="300" rx="18"/>
  <text class="h" x="480" y="190">PromotionCase</text>
  <text class="body" x="480" y="220">PK: case_id · immutable evaluated evidence</text>
  <text class="small" x="480" y="255">Scenario</text>
  <text class="body" x="575" y="255">store · baseline · stock · day · weather · event</text>
  <text class="small" x="480" y="290">Decision</text>
  <text class="body" x="575" y="290">chosen_discount</text>
  <text class="small" x="480" y="325">Outcome</text>
  <text class="body" x="575" y="325">units_sold · gross_profit</text>
  <text class="small" x="480" y="360">Oracle</text>
  <text class="body" x="575" y="360">best_discount · best_gross_profit</text>
  <text class="small" x="480" y="395">Evaluation</text>
  <text class="body" x="575" y="395">regret · regret_pct</text>
  <text class="body" x="480" y="430">One autonomous decision becomes reusable evidence.</text>

  <rect class="memory" x="1035" y="170" width="300" height="260" rx="18"/>
  <text class="h" x="1060" y="210">Lesson</text>
  <text class="body" x="1060" y="240">PK: deterministic lesson_key</text>
  <text class="small" x="1060" y="275">scope + context conditions</text>
  <text class="small" x="1060" y="305">recommended_discount</text>
  <text class="small" x="1060" y="335">rationale</text>
  <text class="small" x="1060" y="365">evidence_count · confidence</text>
  <text class="small" x="1060" y="395">avg_profit_advantage_pct</text>
  <text class="body" x="1060" y="418">Updated as evidence accumulates</text>

  <rect class="actor" x="555" y="500" width="280" height="85" rx="16"/>
  <text class="h" x="580" y="537">Evaluator / Learner</text>
  <text class="body" x="580" y="563">oracle replay · write · update</text>

  <rect class="actor" x="1035" y="500" width="280" height="85" rx="16"/>
  <text class="h" x="1060" y="537">Promotion Agent</text>
  <text class="body" x="1060" y="563">retrieves lessons · chooses discount</text>

  <path class="arrow" d="M320 300 H445"/>
  <text class="label" x="340" y="282">case_sku</text>

  <path class="arrowMemory" d="M875 300 H1025"/>
  <text class="memoryLabel" x="895" y="282">lesson_evidence</text>

  <path class="arrowMemory dashed" d="M1080 170 Q900 85 320 230"/>
  <text class="memoryLabel" x="650" y="110">lesson_sku_scope · optional</text>

  <path class="arrowMemory" d="M665 500 V460"/>
  <text class="memoryLabel" x="680" y="486">write case</text>

  <path class="arrowMemory" d="M835 542 H930 Q980 542 1045 430"/>
  <text class="memoryLabel" x="875" y="525">update Lesson</text>

  <path class="arrowMemory" d="M1180 430 V490"/>
  <text class="memoryLabel" x="1196" y="470">retrieve</text>

  <path class="arrow" d="M1035 552 H920 Q885 552 850 450"/>
  <text class="label" x="895" y="575">chosen discount</text>
</svg>
