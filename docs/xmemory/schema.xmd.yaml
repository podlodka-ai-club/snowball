xmd_version: v1

title: FMCG Promotion Agent Memory

description: >-
  Durable memory for a self-learning FMCG promotion agent. Store only three domain
  objects: SKU, evaluated PromotionCase evidence, and compact Lesson objects that are
  retrieved before future discount decisions. Do not store prompts, hidden reasoning,
  simulator internals, or counterfactual actions as separate memory records.

objects:
  SKU:
    description: >-
      A sellable FMCG item used by the promotion agent. Repeated mentions of the same
      stable sku_id refer to the same SKU. Keep this object intentionally small; scenario
      context belongs to PromotionCase rather than to the product master record.
    fields:
      sku_id:
        type: str
        required: true
        description: Stable application SKU identifier exactly as supplied.
      name:
        type: str
        required: false
        description: Display product name, for example Ice Cream 500ml.
      category:
        type: str
        required: true
        description: >-
          Normalised category used to generalise lessons across similar SKUs, for example
          ice_cream, beer, soft_drinks, chips, meat, or yogurt.
      base_price:
        type: float
        required: true
        description: Baseline shelf price before promotion in the scenario currency.
      cost:
        type: float
        required: true
        description: Unit cost used by the simulator to calculate gross profit.
    primary_key: [sku_id]

  PromotionCase:
    description: >-
      One completed promotion decision after the market simulator and counterfactual
      evaluator have run. It stores scenario context, the discount chosen by the Promotion
      Agent, the realised outcome, all four counterfactual gross profits, the simulator
      oracle, and regret. Cases are factual evidence and should be treated as immutable
      after evaluation except for bad-data fixes.
    fields:
      case_id:
        type: str
        required: true
        description: >-
          Stable application case identifier in the form
          CASE-<simulator_version>-<scenario_id>, for example
          CASE-v1-SCN-20260718-LONDON_CENTRAL-ICE500.
      scenario_date:
        type: str
        required: false
        description: Scenario date normalised as YYYY-MM-DD when supplied.
      store:
        type: str
        required: true
        description: Store or store-cluster label, for example London Central.
      price:
        type: float
        required: true
        description: Shelf price before the promotion for this scenario.
      baseline_sales:
        type: int
        required: true
        description: Expected or historical baseline unit sales before promotion.
      stock:
        type: int
        required: true
        description: Units available before the simulated promotion.
      stock_level:
        type: str
        required: true
        enum: [normal, high]
        description: >-
          Retrieval bucket derived by application code from stock and baseline demand.
          Keep only normal and high for the MVP unless low-stock scenarios are introduced.
      day_type:
        type: str
        required: true
        enum: [weekday, weekend]
        description: Coarse timing factor used by both the simulator and lesson retrieval.
      weather:
        type: str
        required: true
        enum: [normal, hot, rain]
        description: Coarse weather factor used by both the simulator and lesson retrieval.
      temperature_c:
        type: float
        required: false
        description: Forecast or historical temperature in Celsius when available.
      event_type:
        type: str
        required: true
        enum: [none, local_event]
        description: Whether a relevant local event is part of the scenario.
      event_note:
        type: str
        required: false
        description: >-
          Optional descriptive event context, for example concert_nearby. The simulator
          should use event_type or deterministic application inputs.
      chosen_discount:
        type: int
        required: true
        enum: [0, 10, 20, 30]
        description: Discount percentage chosen by the Promotion Agent and applied in the simulator.
      units_sold:
        type: int
        required: true
        description: Units sold for the chosen discount.
      gross_profit:
        type: float
        required: true
        description: Gross profit produced by the chosen discount.
      profit_0:
        type: float
        required: true
        description: Gross profit from replaying this exact scenario with a 0 percent discount.
      profit_10:
        type: float
        required: true
        description: Gross profit from replaying this exact scenario with a 10 percent discount.
      profit_20:
        type: float
        required: true
        description: Gross profit from replaying this exact scenario with a 20 percent discount.
      profit_30:
        type: float
        required: true
        description: Gross profit from replaying this exact scenario with a 30 percent discount.
      best_discount:
        type: int
        required: true
        enum: [0, 10, 20, 30]
        description: Discount with the highest gross profit when all four actions are replayed.
      best_gross_profit:
        type: float
        required: true
        description: Highest gross profit found by replaying all allowed discounts.
      regret:
        type: float
        required: true
        description: >-
          Gross-profit regret of the chosen action, calculated in code as
          best_gross_profit minus gross_profit.
      regret_pct:
        type: float
        required: true
        description: >-
          Regret divided by best_gross_profit and expressed as a percentage. Calculate this
          in application code rather than deriving it with the model.
    primary_key: [case_id]

  Lesson:
    description: >-
      Compact reusable promotion knowledge derived from multiple evaluated PromotionCase
      records. This is the main memory object read by the Promotion Agent. Repeated
      evidence for the same deterministic lesson_key updates the same Lesson rather than
      creating near-duplicate prose lessons.
    fields:
      lesson_key:
        type: str
        required: true
        description: >-
          Deterministic key supplied by learner code. Build it from scope plus applicable
          context buckets, using any for omitted conditions. Example:
          category:ice_cream|store:any|weekend|hot|event:any|stock:high.
      scope:
        type: str
        required: true
        description: >-
          Generalisation scope in a simple parseable form such as sku:ICE500 or
          category:ice_cream.
      store_scope:
        type: str
        required: false
        description: >-
          Store label when evidence is intentionally store-specific. Leave empty for a
          lesson intended to generalise across stores.
      day_type:
        type: str
        required: false
        enum: [weekday, weekend]
        description: Applicability condition. Leave empty when the lesson applies to both.
      weather:
        type: str
        required: false
        enum: [normal, hot, rain]
        description: Applicability condition. Leave empty when weather is not material.
      event_type:
        type: str
        required: false
        enum: [none, local_event]
        description: Applicability condition. Leave empty when event context is not material.
      stock_level:
        type: str
        required: false
        enum: [normal, high]
        description: Applicability condition. Leave empty when stock level is not material.
      recommended_discount:
        type: int
        required: true
        enum: [0, 10, 20, 30]
        description: Discount currently supported by accumulated simulator evidence.
      rationale:
        type: str
        required: true
        description: >-
          Short evidence-grounded explanation of why the recommendation works. Preserve
          concrete effects such as demand response or margin destruction; do not invent
          causal claims that are not supported by linked cases.
      evidence_count:
        type: int
        required: true
        description: Number of linked evaluated cases currently used as evidence.
      confidence:
        type: float
        required: true
        description: >-
          Learner confidence from 0.0 to 1.0. Compute or validate this in application code
          from evidence agreement rather than trusting free-form model confidence.
      avg_profit_advantage_pct:
        type: float
        required: false
        description: >-
          Average gross-profit advantage of recommended_discount over the best alternative
          among linked cases, expressed as a percentage and calculated in application code.
      updated_on:
        type: str
        required: false
        description: Date of the latest lesson update normalised as YYYY-MM-DD.
    primary_key: [lesson_key]

relations:
  case_sku:
    description: Connect each evaluated PromotionCase to the SKU whose promotion was tested.
    objects:
      case:
        type: PromotionCase
        on_delete: cascade
        description: The evaluated promotion case.
      sku:
        type: SKU
        on_delete: nullify
        description: The SKU evaluated in the case.
    keys:
      one_sku_per_case: [case]

  lesson_evidence:
    description: >-
      Connect a Lesson to every PromotionCase that was actually used as evidence to create
      or update that lesson. This relation is the primary write -> read trace for the demo.
    objects:
      lesson:
        type: Lesson
        on_delete: cascade
        description: The reusable lesson supported by evaluated evidence.
      case:
        type: PromotionCase
        on_delete: cascade
        description: A case used to create, reinforce, or revise the lesson.
    keys:
      unique_lesson_case: [lesson, case]

  lesson_sku_scope:
    description: >-
      Optionally connect a SKU-scoped Lesson directly to the SKU it applies to. Category
      lessons may omit this relation and use the structured scope field instead.
    objects:
      lesson:
        type: Lesson
        on_delete: cascade
        description: A lesson with SKU-specific scope.
      sku:
        type: SKU
        on_delete: nullify
        description: The SKU the lesson directly applies to.
    keys:
      unique_lesson_sku: [lesson, sku]
