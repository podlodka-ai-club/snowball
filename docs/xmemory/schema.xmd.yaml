xmd_version: v1

title: FMCG Promotion Agent Memory

description: >-
  Durable product memory for a self-learning FMCG promotion agent. Store evaluated
  promotion cases as factual evidence and compact promotion rules that can be read
  before future decisions. Do not extract prompts, hidden reasoning, simulator logs,
  or unrelated FMCG facts.

objects:
  Product:
    description: >-
      A sellable FMCG SKU evaluated by the promotion agent. Repeated mentions of the
      same stable SKU refer to the same Product.
    fields:
      sku:
        type: str
        required: true
        description: Stable application SKU or product code exactly as supplied.
      name:
        type: str
        required: false
        description: Human-readable product name.
      brand:
        type: str
        required: false
        description: Product brand when supplied.
      category:
        type: str
        required: false
        description: Normalised product category used for retrieval and rule generalisation.
    primary_key: [sku]

  StoreCluster:
    description: >-
      A stable group of stores or market segment in which promotion performance is
      evaluated. Repeated mentions of the same cluster_id refer to the same cluster.
    fields:
      cluster_id:
        type: str
        required: true
        description: Stable application identifier for the store cluster.
      name:
        type: str
        required: false
        description: Human-readable cluster name.
      market:
        type: str
        required: false
        description: City, region, or country label used to describe the cluster.
    primary_key: [cluster_id]

  PromotionCase:
    description: >-
      One completed promotion scenario after the evaluator has replayed all allowed
      actions. A case records the scenario, the agent's chosen action, its observed
      simulator outcome, the counterfactual optimum, and regret. Do not create a case
      for an unevaluated scenario.
    fields:
      case_id:
        type: str
        required: true
        description: Stable case identifier generated by the application, for example CASE-0042.
      observed_on:
        type: str
        required: false
        description: Scenario or evaluation date normalised as YYYY-MM-DD when supplied.
      base_price:
        type: float
        required: true
        description: Product shelf price before the promotion, in the scenario currency.
      baseline_units:
        type: int
        required: true
        description: Expected or historical baseline unit sales before the evaluated promotion.
      stock_level:
        type: str
        required: true
        enum: [low, normal, high]
        description: >-
          Coarse stock bucket supplied by the scenario. Use low for constrained stock,
          normal for ordinary availability, and high for excess or abundant stock.
      day_type:
        type: str
        required: true
        enum: [weekday, weekend]
        description: >-
          Demand timing bucket. Friday evening through Sunday should be treated as
          weekend when the scenario generator uses that convention; otherwise keep the
          explicit bucket supplied by the application.
      competitor_discount:
        type: int
        required: false
        enum: [0, 10, 20, 30]
        description: Competitor discount percentage relevant to the scenario, if known.
      chosen_discount:
        type: int
        required: true
        enum: [0, 10, 20, 30]
        description: Discount percentage selected by the Promotion Agent.
      actual_units:
        type: int
        required: true
        description: Units sold in the simulator for the chosen discount.
      actual_gross_profit:
        type: float
        required: true
        description: Gross profit produced by the simulator for the chosen discount.
      optimal_discount:
        type: int
        required: true
        enum: [0, 10, 20, 30]
        description: Discount percentage with the highest gross profit in counterfactual replay.
      optimal_gross_profit:
        type: float
        required: true
        description: Highest gross profit found by replaying every allowed discount.
      regret:
        type: float
        required: true
        description: >-
          Absolute gross-profit regret calculated by the evaluator as
          optimal_gross_profit minus actual_gross_profit. It must never be invented by extraction.
      regret_pct:
        type: float
        required: true
        description: >-
          Regret as a percentage of optimal_gross_profit, calculated by application code.
      decision_quality:
        type: str
        required: true
        enum: [optimal, near_optimal, poor]
        description: >-
          Evaluation label supplied by application code. optimal means zero or negligible
          regret, near_optimal means acceptable positive regret, and poor means the
          configured regret threshold was exceeded.
    primary_key: [case_id]

  PromotionRule:
    description: >-
      A compact reusable policy lesson derived from evaluated PromotionCase evidence.
      It describes when a discount tends to work and is the main object retrieved before
      future decisions. Repeated writes with the same rule_key update the same rule.
    fields:
      rule_key:
        type: str
        required: true
        description: >-
          Deterministic segment key supplied by the learner, for example
          soft_drinks|high|weekend|comp10. Do not generate a new random key for the
          same segment.
      context_summary:
        type: str
        required: true
        description: Concise description of the scenario conditions in which the rule applies.
      recommended_discount:
        type: int
        required: true
        enum: [0, 10, 20, 30]
        description: Discount percentage currently recommended by the accumulated evidence.
      rationale:
        type: str
        required: true
        description: >-
          Short evidence-grounded explanation of why this discount is preferred. Preserve
          concrete business effects such as margin loss or insufficient volume lift.
      evidence_count:
        type: int
        required: true
        description: Number of evaluated cases currently supporting this rule, supplied by learner code.
      confidence:
        type: float
        required: true
        description: Learner confidence from 0.0 to 1.0, supplied by application code.
      avg_regret_pct:
        type: float
        required: false
        description: Average regret percentage across the evidence used for this rule.
      status:
        type: str
        required: true
        enum: [active, superseded]
        default: active
        description: >-
          active rules may be retrieved for decisions. superseded rules are retained for
          observability but should not influence new decisions.
      updated_on:
        type: str
        required: false
        description: Date of the latest rule update normalised as YYYY-MM-DD.
    primary_key: [rule_key]

relations:
  case_product:
    description: >-
      Connect an evaluated PromotionCase to the Product whose promotion was evaluated.
    objects:
      case:
        type: PromotionCase
        on_delete: cascade
        description: The evaluated promotion case.
      product:
        type: Product
        on_delete: nullify
        description: The product evaluated in the case.
    keys:
      one_product_per_case: [case]

  case_cluster:
    description: >-
      Connect an evaluated PromotionCase to the StoreCluster in which the scenario applies.
    objects:
      case:
        type: PromotionCase
        on_delete: cascade
        description: The evaluated promotion case.
      cluster:
        type: StoreCluster
        on_delete: nullify
        description: The store cluster for the case.
    keys:
      one_cluster_per_case: [case]

  case_supports_rule:
    description: >-
      Connect a PromotionCase to a PromotionRule only when that evaluated case was used
      as evidence to create, reinforce, or revise the rule.
    objects:
      case:
        type: PromotionCase
        on_delete: cascade
        description: An evaluated case providing evidence.
      rule:
        type: PromotionRule
        on_delete: cascade
        description: The reusable rule supported or revised by the case.
    keys:
      unique_case_rule_pair: [case, rule]
